[project]
name = "numer-identity"
version = "0.1.0"
description = "Firebase ID token verification for NUmer module backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numer_identity"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
