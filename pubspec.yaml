name: numer_app
description: Study Group app with onboarding, courses, timer, and alarms
publish_to: "none"

version: 1.0.3+32

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # state & UI
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

  # charts
  fl_chart: ^1.1.1
  table_calendar: ^3.1.2

  # storage / persistence
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2

  # notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # (optional cloud sync)
  firebase_core: ^4.4.0
  firebase_app_check: ^0.4.1+4
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  animations: ^2.0.11
  connectivity_plus: ^7.0.0
  vector_math: ^2.1.4
  cloud_functions: ^6.0.6
  path_provider: ^2.1.5
  url_launcher: ^6.2.5
  firebase_messaging: ^16.1.1
  flutter_timezone: ^5.0.1
  excel: ^4.0.6
  package_info_plus: ^9.0.0
  font_awesome_flutter: ^10.12.0
  material_design_icons_flutter: ^7.0.7296
  phosphor_flutter: ^2.1.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a1a2e"

  min_sdk_android: 21
